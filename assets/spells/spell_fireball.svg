    <rect x="10" y="13" width="12" height="1" fill="#E8B83F"/>
    <rect x="10" y="14" width="12" height="1" fill="#FF6B2D"/>
    <rect x="11" y="15" width="10" height="1" fill="#FF6B2D"/>
    <rect x="11" y="16" width="10" height="1" fill="#FF6B2D"/>
    <rect x="12" y="17" width="8" height="1" fill="#FF6B2D"/>
    <rect x="12" y="18" width="8" height="1" fill="#E83F5B"/>
    <rect x="13" y="19" width="6" height="1" fill="#E83F5B"/>
