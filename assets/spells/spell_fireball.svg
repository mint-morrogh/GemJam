    <rect x="13" y="11" width="6" height="1" fill="#FF6B2D"/>
    <rect x="13" y="12" width="6" height="1" fill="#E83F5B"/>
    <rect x="14" y="13" width="4" height="1" fill="#E83F5B"/>
