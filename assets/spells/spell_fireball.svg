<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Fireball: Orange-red core, yellow edge, flame particles -->
  <g id="effects">
    <!-- Outer glow/heat shimmer -->
    <rect x="10" y="4" width="2" height="2" fill="#FFD52D" opacity="0.5"/>
    <rect x="20" y="6" width="2" height="2" fill="#FFD52D" opacity="0.5"/>
    <rect x="6" y="14" width="2" height="2" fill="#FF6B2D" opacity="0.5"/>
    <rect x="24" y="18" width="2" height="2" fill="#FF6B2D" opacity="0.5"/>
    <!-- Spark particles -->
    <rect x="8" y="8" width="1" height="1" fill="#FFFFFF"/>
    <rect x="23" y="10" width="1" height="1" fill="#FFFFFF"/>
    <rect x="11" y="24" width="1" height="1" fill="#FFFFFF"/>
    <rect x="22" y="22" width="1" height="1" fill="#FFD52D"/>
