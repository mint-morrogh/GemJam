    <rect x="12" y="17" width="1" height="2" fill="#0A0A14"/>
    <rect x="19" y="17" width="1" height="2" fill="#0A0A14"/>
    <rect x="13" y="19" width="1" height="2" fill="#0A0A14"/>
    <rect x="18" y="19" width="1" height="2" fill="#0A0A14"/>
    <rect x="14" y="21" width="1" height="2" fill="#0A0A14"/>
    <rect x="17" y="21" width="1" height="2" fill="#0A0A14"/>
