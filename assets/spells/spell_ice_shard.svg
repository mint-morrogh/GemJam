<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Ice Shard: Cyan core, white highlights, frost particles -->
  <g id="effects">
    <!-- Frost particles -->
    <rect x="5" y="6" width="1" height="1" fill="#FFFFFF"/>
    <rect x="26" y="8" width="1" height="1" fill="#FFFFFF"/>
    <rect x="7" y="22" width="1" height="1" fill="#2DD4FF"/>
    <rect x="24" y="20" width="1" height="1" fill="#FFFFFF"/>
    <rect x="9" y="4" width="1" height="1" fill="#2DD4FF"/>
    <rect x="22" y="26" width="1" height="1" fill="#2DD4FF"/>
    <rect x="4" y="16" width="1" height="1" fill="#FFFFFF"/>
    <rect x="27" y="14" width="1" height="1" fill="#FFFFFF"/>
  </g>
  <g id="base">
    <!-- Main shard - large central crystal pointing up -->
    <rect x="15" y="4" width="2" height="1" fill="#2DD4FF"/>
    <rect x="14" y="5" width="4" height="1" fill="#2DD4FF"/>
    <rect x="14" y="6" width="4" height="1" fill="#2DD4FF"/>
    <rect x="13" y="7" width="6" height="1" fill="#2DD4FF"/>
    <rect x="13" y="8" width="6" height="1" fill="#3F6AE8"/>
    <rect x="13" y="9" width="6" height="1" fill="#3F6AE8"/>
    <rect x="12" y="10" width="8" height="1" fill="#3F6AE8"/>
    <rect x="12" y="11" width="8" height="1" fill="#1B3A9B"/>
    <rect x="12" y="12" width="8" height="1" fill="#1B3A9B"/>
    <rect x="11" y="13" width="10" height="1" fill="#1B3A9B"/>
    <rect x="11" y="14" width="10" height="1" fill="#1B3A9B"/>
    <!-- Bottom shard cluster -->
    <rect x="11" y="15" width="10" height="1" fill="#3F6AE8"/>
    <rect x="12" y="16" width="8" height="1" fill="#3F6AE8"/>
    <rect x="12" y="17" width="8" height="1" fill="#2DD4FF"/>
    <rect x="13" y="18" width="6" height="1" fill="#2DD4FF"/>
    <rect x="13" y="19" width="6" height="1" fill="#3F6AE8"/>
    <rect x="14" y="20" width="4" height="1" fill="#1B3A9B"/>
    <!-- Left shard -->
    <rect x="8" y="11" width="3" height="1" fill="#2DD4FF"/>
    <rect x="7" y="12" width="4" height="1" fill="#3F6AE8"/>
    <rect x="7" y="13" width="3" height="1" fill="#1B3A9B"/>
    <rect x="8" y="14" width="2" height="1" fill="#1B3A9B"/>
    <!-- Right shard -->
    <rect x="21" y="11" width="3" height="1" fill="#2DD4FF"/>
    <rect x="21" y="12" width="4" height="1" fill="#3F6AE8"/>
    <rect x="22" y="13" width="3" height="1" fill="#1B3A9B"/>
    <rect x="22" y="14" width="2" height="1" fill="#1B3A9B"/>
  </g>
  <g id="outline">
    <!-- Central shard outline -->
    <rect x="15" y="3" width="2" height="1" fill="#0A0A14"/>
    <rect x="14" y="4" width="1" height="1" fill="#0A0A14"/>
    <rect x="17" y="4" width="1" height="1" fill="#0A0A14"/>
    <rect x="13" y="5" width="1" height="2" fill="#0A0A14"/>
    <rect x="18" y="5" width="1" height="2" fill="#0A0A14"/>
    <rect x="12" y="7" width="1" height="3" fill="#0A0A14"/>
    <rect x="19" y="7" width="1" height="3" fill="#0A0A14"/>
    <rect x="11" y="10" width="1" height="3" fill="#0A0A14"/>
    <rect x="20" y="10" width="1" height="3" fill="#0A0A14"/>
    <rect x="10" y="13" width="1" height="3" fill="#0A0A14"/>
    <rect x="21" y="13" width="1" height="2" fill="#0A0A14"/>
    <rect x="11" y="16" width="1" height="1" fill="#0A0A14"/>
    <rect x="20" y="16" width="1" height="1" fill="#0A0A14"/>
    <rect x="12" y="17" width="1" height="1" fill="#0A0A14"/>
    <rect x="19" y="17" width="1" height="1" fill="#0A0A14"/>
    <rect x="13" y="18" width="1" height="2" fill="#0A0A14"/>
    <rect x="18" y="18" width="1" height="2" fill="#0A0A14"/>
    <rect x="14" y="20" width="1" height="1" fill="#0A0A14"/>
    <rect x="17" y="20" width="1" height="1" fill="#0A0A14"/>
    <rect x="14" y="21" width="4" height="1" fill="#0A0A14"/>
    <!-- Left shard outline -->
    <rect x="7" y="11" width="1" height="1" fill="#0A0A14"/>
    <rect x="6" y="12" width="1" height="2" fill="#0A0A14"/>
    <rect x="7" y="14" width="1" height="1" fill="#0A0A14"/>
    <rect x="8" y="15" width="2" height="1" fill="#0A0A14"/>
    <!-- Right shard outline -->
    <rect x="24" y="11" width="1" height="1" fill="#0A0A14"/>
    <rect x="25" y="12" width="1" height="2" fill="#0A0A14"/>
    <rect x="24" y="14" width="1" height="1" fill="#0A0A14"/>
    <rect x="22" y="15" width="2" height="1" fill="#0A0A14"/>
  </g>
  <g id="highlight">
    <!-- White highlights on shards -->
    <rect x="15" y="5" width="1" height="1" fill="#FFFFFF"/>
    <rect x="14" y="7" width="1" height="1" fill="#FFFFFF"/>
    <rect x="13" y="10" width="1" height="1" fill="#E0E8F0"/>
    <rect x="8" y="11" width="1" height="1" fill="#FFFFFF"/>
    <rect x="21" y="11" width="1" height="1" fill="#E0E8F0"/>
  </g>
</svg>
