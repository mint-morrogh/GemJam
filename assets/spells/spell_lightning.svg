    <rect x="10" y="17" width="1" height="2" fill="#0A0A14"/>
    <rect x="17" y="16" width="1" height="1" fill="#0A0A14"/>
    <rect x="16" y="17" width="1" height="2" fill="#0A0A14"/>
    <rect x="11" y="19" width="1" height="1" fill="#0A0A14"/>
    <rect x="15" y="19" width="1" height="1" fill="#0A0A14"/>
    <rect x="12" y="20" width="1" height="1" fill="#0A0A14"/>
