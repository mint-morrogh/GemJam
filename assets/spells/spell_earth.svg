<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Earth: Brown rock shards, dust particles -->
  <g id="effects">
    <!-- Dust/debris particles -->
    <rect x="5" y="12" width="2" height="1" fill="#8B6914"/>
    <rect x="25" y="10" width="2" height="1" fill="#E8B83F"/>
    <rect x="7" y="22" width="1" height="1" fill="#8B6914"/>
    <rect x="24" y="24" width="1" height="1" fill="#8B6914"/>
    <rect x="4" y="17" width="1" height="1" fill="#E8B83F"/>
    <rect x="27" y="18" width="1" height="1" fill="#E8B83F"/>
    <rect x="9" y="5" width="1" height="1" fill="#8B6914"/>
    <rect x="22" y="6" width="1" height="1" fill="#8B6914"/>
  </g>
  <g id="base">
    <!-- Central large rock -->
    <rect x="12" y="11" width="8" height="1" fill="#E8B83F"/>
    <rect x="11" y="12" width="10" height="1" fill="#E8B83F"/>
    <rect x="10" y="13" width="12" height="1" fill="#8B6914"/>
    <rect x="10" y="14" width="12" height="1" fill="#8B6914"/>
    <rect x="10" y="15" width="12" height="1" fill="#8B6914"/>
    <rect x="11" y="16" width="10" height="1" fill="#8B6914"/>
    <rect x="11" y="17" width="10" height="1" fill="#3A3A4A"/>
    <rect x="12" y="18" width="8" height="1" fill="#3A3A4A"/>
    <!-- Upper-left shard -->
    <rect x="8" y="7" width="4" height="1" fill="#E8B83F"/>
    <rect x="7" y="8" width="5" height="1" fill="#8B6914"/>
    <rect x="7" y="9" width="5" height="1" fill="#8B6914"/>
    <rect x="8" y="10" width="4" height="1" fill="#3A3A4A"/>
    <!-- Upper-right shard -->
    <rect x="20" y="6" width="3" height="1" fill="#E8B83F"/>
    <rect x="19" y="7" width="5" height="1" fill="#E8B83F"/>
    <rect x="19" y="8" width="5" height="1" fill="#8B6914"/>
    <rect x="20" y="9" width="4" height="1" fill="#8B6914"/>
    <rect x="21" y="10" width="2" height="1" fill="#3A3A4A"/>
    <!-- Lower-left shard -->
    <rect x="7" y="18" width="3" height="1" fill="#8B6914"/>
    <rect x="8" y="19" width="3" height="1" fill="#8B6914"/>
    <rect x="8" y="20" width="3" height="1" fill="#3A3A4A"/>
    <rect x="9" y="21" width="2" height="1" fill="#3A3A4A"/>
    <!-- Lower-right shard -->
    <rect x="21" y="18" width="3" height="1" fill="#8B6914"/>
    <rect x="20" y="19" width="4" height="1" fill="#8B6914"/>
    <rect x="20" y="20" width="4" height="1" fill="#3A3A4A"/>
    <rect x="21" y="21" width="3" height="1" fill="#3A3A4A"/>
    <!-- Ground crack lines -->
    <rect x="13" y="22" width="6" height="1" fill="#3A3A4A"/>
    <rect x="14" y="23" width="4" height="1" fill="#3A3A4A"/>
    <rect x="15" y="24" width="2" height="1" fill="#4A4A5A"/>
  </g>
  <g id="outline">
    <!-- Central rock outline -->
    <rect x="12" y="10" width="8" height="1" fill="#0A0A14"/>
    <rect x="9" y="11" width="3" height="1" fill="#0A0A14"/>
    <rect x="20" y="11" width="2" height="1" fill="#0A0A14"/>
    <rect x="9" y="12" width="2" height="1" fill="#0A0A14"/>
    <rect x="21" y="12" width="1" height="1" fill="#0A0A14"/>
    <rect x="9" y="13" width="1" height="4" fill="#0A0A14"/>
    <rect x="22" y="13" width="1" height="3" fill="#0A0A14"/>
    <rect x="10" y="17" width="1" height="1" fill="#0A0A14"/>
    <rect x="21" y="16" width="1" height="1" fill="#0A0A14"/>
    <rect x="11" y="18" width="1" height="1" fill="#0A0A14"/>
    <rect x="20" y="18" width="1" height="1" fill="#0A0A14"/>
    <rect x="12" y="19" width="8" height="1" fill="#0A0A14"/>
