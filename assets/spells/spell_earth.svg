    <rect x="8" y="6" width="4" height="1" fill="#0A0A14"/>
    <rect x="6" y="7" width="2" height="1" fill="#0A0A14"/>
    <rect x="6" y="8" width="1" height="2" fill="#0A0A14"/>
    <rect x="7" y="10" width="1" height="1" fill="#0A0A14"/>
    <rect x="8" y="11" width="1" height="1" fill="#0A0A14"/>
    <rect x="12" y="7" width="1" height="3" fill="#0A0A14"/>
    <!-- Upper-right shard outline -->
    <rect x="20" y="5" width="3" height="1" fill="#0A0A14"/>
    <rect x="24" y="6" width="1" height="3" fill="#0A0A14"/>
    <rect x="23" y="9" width="1" height="1" fill="#0A0A14"/>
    <rect x="23" y="10" width="1" height="1" fill="#0A0A14"/>
    <rect x="18" y="7" width="1" height="3" fill="#0A0A14"/>
    <!-- Lower-left shard outline -->
    <rect x="6" y="18" width="1" height="1" fill="#0A0A14"/>
    <rect x="7" y="19" width="1" height="1" fill="#0A0A14"/>
    <rect x="7" y="20" width="1" height="1" fill="#0A0A14"/>
    <rect x="8" y="21" width="1" height="1" fill="#0A0A14"/>
    <rect x="9" y="22" width="2" height="1" fill="#0A0A14"/>
    <rect x="11" y="18" width="1" height="3" fill="#0A0A14"/>
    <!-- Lower-right shard outline -->
    <rect x="24" y="18" width="1" height="1" fill="#0A0A14"/>
    <rect x="24" y="19" width="1" height="2" fill="#0A0A14"/>
    <rect x="23" y="21" width="1" height="1" fill="#0A0A14"/>
    <rect x="21" y="22" width="3" height="1" fill="#0A0A14"/>
    <rect x="19" y="19" width="1" height="2" fill="#0A0A14"/>
    <!-- Ground cracks outline -->
    <rect x="12" y="22" width="1" height="1" fill="#0A0A14"/>
    <rect x="19" y="22" width="1" height="1" fill="#0A0A14"/>
    <rect x="13" y="23" width="1" height="1" fill="#0A0A14"/>
    <rect x="18" y="23" width="1" height="1" fill="#0A0A14"/>
    <rect x="14" y="24" width="1" height="1" fill="#0A0A14"/>
    <rect x="17" y="24" width="1" height="1" fill="#0A0A14"/>
    <rect x="15" y="25" width="2" height="1" fill="#0A0A14"/>
  </g>
  <g id="highlight">
    <rect x="13" y="11" width="1" height="1" fill="#FFD52D"/>
    <rect x="8" y="7" width="1" height="1" fill="#FFD52D"/>
    <rect x="20" y="6" width="1" height="1" fill="#FFD52D"/>
    <rect x="11" y="13" width="1" height="1" fill="#E8B83F"/>
  </g>
</svg>
