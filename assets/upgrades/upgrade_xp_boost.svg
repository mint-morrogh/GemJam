<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- XP Boost: White star on blue badge -->
  <g id="outline">
    <rect x="1" y="1" width="14" height="14" fill="none" stroke="#4A4A5A" stroke-width="1"/>
  </g>
  <g id="base">
    <!-- Badge fill -->
    <rect x="2" y="2" width="12" height="12" fill="#1B3A9B"/>
    <!-- Star shape -->
    <!-- Top point -->
    <rect x="7" y="3" width="2" height="1" fill="#E0E8F0"/>
    <rect x="7" y="4" width="2" height="1" fill="#E0E8F0"/>
    <!-- Left arm -->
    <rect x="3" y="6" width="3" height="1" fill="#E0E8F0"/>
    <rect x="4" y="7" width="2" height="1" fill="#A8B8C8"/>
    <!-- Right arm -->
    <rect x="10" y="6" width="3" height="1" fill="#E0E8F0"/>
    <rect x="10" y="7" width="2" height="1" fill="#A8B8C8"/>
    <!-- Center body -->
    <rect x="6" y="5" width="4" height="1" fill="#E0E8F0"/>
    <rect x="5" y="6" width="6" height="1" fill="#FFFFFF"/>
    <rect x="5" y="7" width="6" height="1" fill="#E0E8F0"/>
    <rect x="6" y="8" width="4" height="1" fill="#E0E8F0"/>
    <rect x="6" y="9" width="4" height="1" fill="#A8B8C8"/>
    <!-- Bottom-left leg -->
    <rect x="4" y="10" width="2" height="1" fill="#A8B8C8"/>
    <rect x="3" y="11" width="2" height="1" fill="#A8B8C8"/>
    <rect x="3" y="12" width="1" height="1" fill="#A8B8C8"/>
    <!-- Bottom-right leg -->
    <rect x="10" y="10" width="2" height="1" fill="#A8B8C8"/>
    <rect x="11" y="11" width="2" height="1" fill="#A8B8C8"/>
    <rect x="12" y="12" width="1" height="1" fill="#A8B8C8"/>
  </g>
  <g id="highlight">
    <rect x="7" y="3" width="1" height="1" fill="#FFFFFF"/>
    <rect x="7" y="6" width="1" height="1" fill="#FFFFFF"/>
  </g>
</svg>
