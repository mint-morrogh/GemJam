<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Defense: Silver shield on green badge -->
  <g id="outline">
    <rect x="1" y="1" width="14" height="14" fill="none" stroke="#4A4A5A" stroke-width="1"/>
  </g>
  <g id="base">
    <!-- Badge fill -->
    <rect x="2" y="2" width="12" height="12" fill="#1B6B3A"/>
    <!-- Shield shape -->
    <rect x="4" y="3" width="8" height="1" fill="#A8B8C8"/>
    <rect x="4" y="4" width="8" height="1" fill="#E0E8F0"/>
    <rect x="4" y="5" width="8" height="1" fill="#E0E8F0"/>
    <rect x="4" y="6" width="8" height="1" fill="#A8B8C8"/>
    <rect x="4" y="7" width="8" height="1" fill="#A8B8C8"/>
    <rect x="5" y="8" width="6" height="1" fill="#A8B8C8"/>
    <rect x="5" y="9" width="6" height="1" fill="#5A5A6A"/>
    <rect x="5" y="10" width="6" height="1" fill="#5A5A6A"/>
    <rect x="6" y="11" width="4" height="1" fill="#5A5A6A"/>
    <rect x="7" y="12" width="2" height="1" fill="#5A5A6A"/>
    <!-- Shield cross emblem -->
    <rect x="7" y="4" width="2" height="5" fill="#3ABF5E"/>
    <rect x="5" y="6" width="6" height="1" fill="#3ABF5E"/>
  </g>
  <g id="highlight">
    <rect x="5" y="4" width="1" height="1" fill="#FFFFFF"/>
    <rect x="5" y="3" width="1" height="1" fill="#E0E8F0"/>
  </g>
</svg>
