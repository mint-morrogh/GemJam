<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Damage Up: Red sword icon on dark badge -->
  <g id="outline">
    <rect x="1" y="1" width="14" height="14" fill="none" stroke="#4A4A5A" stroke-width="1"/>
  </g>
  <g id="base">
    <!-- Badge fill -->
    <rect x="2" y="2" width="12" height="12" fill="#9B1B30"/>
    <!-- Sword blade (vertical) -->
    <rect x="7" y="3" width="2" height="1" fill="#A8B8C8"/>
    <rect x="7" y="4" width="2" height="1" fill="#E0E8F0"/>
    <rect x="7" y="5" width="2" height="1" fill="#E0E8F0"/>
    <rect x="7" y="6" width="2" height="1" fill="#E0E8F0"/>
    <rect x="7" y="7" width="2" height="1" fill="#A8B8C8"/>
    <rect x="7" y="8" width="2" height="1" fill="#A8B8C8"/>
    <!-- Crossguard -->
    <rect x="5" y="9" width="6" height="1" fill="#E8B83F"/>
    <rect x="5" y="10" width="6" height="1" fill="#8B6914"/>
    <!-- Grip -->
    <rect x="7" y="11" width="2" height="1" fill="#8B6914"/>
    <rect x="7" y="12" width="2" height="1" fill="#3A3A4A"/>
    <!-- Pommel -->
    <rect x="7" y="13" width="2" height="1" fill="#E8B83F"/>
  </g>
  <g id="highlight">
    <rect x="7" y="3" width="1" height="1" fill="#FFFFFF"/>
    <rect x="7" y="5" width="1" height="1" fill="#FFFFFF"/>
  </g>
</svg>
