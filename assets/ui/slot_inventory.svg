<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" shape-rendering="crispEdges">
  <!-- Inventory slot: Dark inset with subtle border -->
  <g id="outline">
    <rect x="0" y="0" width="18" height="18" fill="#0A0A14"/>
  </g>
  <g id="base">
    <!-- Outer border -->
    <rect x="1" y="1" width="16" height="16" fill="#4A4A5A"/>
    <!-- Inset shadow top -->
    <rect x="2" y="2" width="14" height="1" fill="#0A0A14"/>
    <!-- Inset shadow left -->
    <rect x="2" y="2" width="1" height="14" fill="#0A0A14"/>
    <!-- Dark fill -->
    <rect x="3" y="3" width="12" height="12" fill="#1A1A2A"/>
    <!-- Bottom edge (lighter for 3D inset) -->
    <rect x="2" y="16" width="14" height="1" fill="#5A5A6A"/>
    <!-- Right edge (lighter for 3D inset) -->
    <rect x="16" y="2" width="1" height="14" fill="#5A5A6A"/>
  </g>
  <g id="highlight">
    <!-- Subtle inner corner highlight -->
    <rect x="3" y="3" width="1" height="1" fill="#2A2A3A"/>
  </g>
</svg>
