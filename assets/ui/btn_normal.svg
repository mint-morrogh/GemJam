<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 16" shape-rendering="crispEdges">
  <!-- Default button: Dark stone with light bevel -->
  <g id="outline">
    <rect x="0" y="0" width="48" height="16" fill="#0A0A14"/>
  </g>
  <g id="base">
    <!-- Main fill -->
    <rect x="1" y="1" width="46" height="14" fill="#3A3A4A"/>
    <!-- Top bevel (light) -->
    <rect x="1" y="1" width="46" height="1" fill="#5A5A6A"/>
    <!-- Left bevel (light) -->
    <rect x="1" y="1" width="1" height="14" fill="#5A5A6A"/>
    <!-- Bottom bevel (dark) -->
    <rect x="1" y="14" width="46" height="1" fill="#2A2A3A"/>
    <!-- Right bevel (dark) -->
    <rect x="46" y="1" width="1" height="14" fill="#2A2A3A"/>
  </g>
  <g id="highlight">
    <!-- Corner highlight -->
    <rect x="2" y="2" width="1" height="1" fill="#4A4A5A"/>
  </g>
</svg>
