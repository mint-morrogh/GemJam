<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Panel/window frame: 9-slice compatible, stone grey with gold trim -->
  <!-- 8px corners, 8px stretchable center -->
  <g id="outline">
    <!-- Outer border -->
    <rect x="0" y="0" width="24" height="1" fill="#0A0A14"/>
    <rect x="0" y="23" width="24" height="1" fill="#0A0A14"/>
    <rect x="0" y="0" width="1" height="24" fill="#0A0A14"/>
    <rect x="23" y="0" width="1" height="24" fill="#0A0A14"/>
  </g>
  <g id="base">
    <!-- Gold trim outer -->
    <rect x="1" y="1" width="22" height="1" fill="#E8B83F"/>
    <rect x="1" y="22" width="22" height="1" fill="#8B6914"/>
    <rect x="1" y="1" width="1" height="22" fill="#E8B83F"/>
    <rect x="22" y="1" width="1" height="22" fill="#8B6914"/>
    <!-- Stone frame -->
    <rect x="2" y="2" width="20" height="1" fill="#4A4A5A"/>
    <rect x="2" y="21" width="20" height="1" fill="#3A3A4A"/>
    <rect x="2" y="2" width="1" height="20" fill="#4A4A5A"/>
    <rect x="21" y="2" width="1" height="20" fill="#3A3A4A"/>
    <!-- Inner gold trim -->
    <rect x="3" y="3" width="18" height="1" fill="#E8B83F"/>
    <rect x="3" y="20" width="18" height="1" fill="#8B6914"/>
    <rect x="3" y="3" width="1" height="18" fill="#E8B83F"/>
    <rect x="20" y="3" width="1" height="18" fill="#8B6914"/>
    <!-- Inner border -->
    <rect x="4" y="4" width="16" height="1" fill="#0A0A14"/>
    <rect x="4" y="19" width="16" height="1" fill="#0A0A14"/>
    <rect x="4" y="4" width="1" height="16" fill="#0A0A14"/>
    <rect x="19" y="4" width="1" height="16" fill="#0A0A14"/>
    <!-- Panel fill (center area) -->
    <rect x="5" y="5" width="14" height="14" fill="#1A1A2A"/>
  </g>
  <g id="highlight">
    <!-- Corner gold highlights -->
    <rect x="1" y="1" width="1" height="1" fill="#FFD52D"/>
    <rect x="22" y="1" width="1" height="1" fill="#E8B83F"/>
    <rect x="1" y="22" width="1" height="1" fill="#E8B83F"/>
  </g>
</svg>
